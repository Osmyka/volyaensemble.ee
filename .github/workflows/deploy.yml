name: Deploy

# Pull requests get the checks only. Anything that lands on main — a direct
# commit or a merge — is built and deployed to Cloudflare.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race; a superseded run on main is cancelled.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm test` builds first, so this also proves the build is sound and
      # leaves dist/ ready for the deploy step.
      - name: Build and test
        run: npm test

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request'
        run: npx wrangler deploy -c dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
